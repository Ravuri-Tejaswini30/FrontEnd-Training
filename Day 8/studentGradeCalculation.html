<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <h2 class="text-center mt-4">Student Grade Calculator</h2>

    <div class="container mt-4">
        <div class="row">

            <!-- Left Side - Form -->
            <div class="col-md-6">

                <div class="card shadow p-4">

                    <form onsubmit="calculate(); return false;">

                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" class="form-control" id="stdname">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Subject 1</label>
                            <input type="number" class="form-control" id="sub1">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Subject 2</label>
                            <input type="number" class="form-control" id="sub2">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Subject 3</label>
                            <input type="number" class="form-control" id="sub3">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Subject 4</label>
                            <input type="number" class="form-control" id="sub4">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Subject 5</label>
                            <input type="number" class="form-control" id="sub5">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Subject 6</label>
                            <input type="number" class="form-control" id="sub6">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Calculate
                        </button>

                    </form>

                </div>

            </div>

            <!-- Right Side - Result -->
            <div class="col-md-6">

                <div class="card shadow p-4">

                    <h4 class="text-center mb-3">Result</h4>

                    <div id="result">
                        Click <b>Calculate</b> to view the result.
                    </div>

                </div>

            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        function calculate() {

            // Student Name
            let studentName = document.getElementById("stdname").value.trim();

            if (studentName == "") {
                alert("Please enter Student Name.");
                return;
            }

            let marks = [];
            let sum = 0;
            let pass = true;

            // Read all subject marks
            for (let i = 1; i <= 6; i++) {

                let value = document.getElementById("sub" + i).value;

                if (value == "") {
                    alert("Please enter marks for Subject " + i);
                    return;
                }

                let mark = Number(value);

                if (isNaN(mark) || mark < 0 || mark > 100) {
                    alert("Subject " + i + " marks should be between 0 and 100.");
                    return;
                }

                marks.push(mark);

                sum += mark;

                if (mark < 35) {
                    pass = false;
                }

            }

            // Average
            let average = sum / marks.length;

            // Grade
            let grade;

            if (!pass) {
                grade = "F";
            }
            else if (average >= 90) {
                grade = "A+";
            }
            else if (average >= 80) {
                grade = "A";
            }
            else if (average >= 70) {
                grade = "B";
            }
            else if (average >= 60) {
                grade = "C";
            }
            else if (average >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            // Display Result

            document.getElementById("result").innerHTML = `

                <table class="table table-bordered">

                    <tr>
                        <th>Student Name</th>
                        <td>${studentName}</td>
                    </tr>

                    <tr>
                        <th>Total Marks</th>
                        <td>${sum}</td>
                    </tr>

                    <tr>
                        <th>Average</th>
                        <td>${average.toFixed(2)}</td>
                    </tr>

                    <tr>
                        <th>Result</th>
                        <td>${pass ? "PASS" : "FAIL"}</td>
                    </tr>

                    <tr>
                        <th>Grade</th>
                        <td>${grade}</td>
                    </tr>

                </table>

            `;

        }

    </script>

</body>
</html>
